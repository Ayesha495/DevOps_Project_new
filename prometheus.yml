global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    basic_auth:
      username: 3185194
      password_file: .env

scrape_configs:
  # Prometheus monitors itself on the default port.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Django calculator app when running locally with:
  # python manage.py runserver 0.0.0.0:8000
  #
  # This requires the app to expose metrics at /metrics.
  - job_name: calculator-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8000
        labels:
          app: calculator
          environment: local

  # Django calculator app through the Kubernetes NodePort in k8s/service.yml.
  # Enable this target when your cluster exposes nodePort 30080 on localhost.
  #
  # This also requires the app to expose metrics at /metrics.
  - job_name: calculator-kubernetes-nodeport
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:30080
        labels:
          app: calculator
          environment: kubernetes

  # Optional: scrape cAdvisor if you run it for container metrics.
  # - job_name: cadvisor
  #   static_configs:
  #     - targets:
  #         - localhost:8080

  # Optional: scrape Node Exporter if you install it for machine metrics.
  # - job_name: node-exporter
  #   static_configs:
  #     - targets:
  #         - localhost:9100
