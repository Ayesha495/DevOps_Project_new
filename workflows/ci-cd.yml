name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [closed]

jobs:
  build-and-push:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-ver1

    steps:
      - name: Checkout Code
        [cite_start]uses: actions/checkout@v4 [cite: 19]

      # Setup Python to run tests before building the image
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Part B: Test Stage (Django Tests) [cite: 22]
      - name: Run Django Tests
        # env:
        #   SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python manage.py test

      # Part B & C: Build and Push [cite: 21, 23, 30]
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ nabihanasir }}
          password: ${{secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ nabihanasir }}/calculator:ver2 .
          docker push ${{ nabihanasir }}/calculator:ver2

  deploy:
    needs: build-and-push
    runs-on: ubuntu-ver1
    steps:
      - [cite_start]name: Deploy to EC2 [cite: 30, 32]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ nabihanasir }}/calculator:ver2
            docker stop django-container || true
            docker rm django-container || true
            # Run container and apply migrations
            docker run -d --name django-container -p 8000:8000 ${{ nabihanasir }}/calculator:ver2
            docker exec django-container python manage.py migrate --noinput